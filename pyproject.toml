[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yeast-xrf"
version = "0.1.0"
description = "Extensible analysis toolkit for yeast XRF HDF5 images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "h5py>=3.11",
  "xarray>=2024.6",
  "dask[array]>=2024.6",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "plotly>=5.22",
  "streamlit>=1.40",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "zarr>=2.18",
  "numcodecs>=0.16",
  "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
yeast-xrf = "yeast_xrf.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
